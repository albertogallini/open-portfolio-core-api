[tool.poetry]
name = "oport"
version = "0.0.1"
description = ""
authors = ["Alberto Gallini <info@openport.com>"]
readme = "README.md"
packages = [{ include = "oport" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
openbb-core = { version = "^1.3.6" }
openbb-charting = { version = "^2.3.5" }
openfigipy = { version = "^0.1.6" }
yfinance =  { version ="^0.2.55" }
xlrd = { version ="^2.0.1" }
plotly =  { version ="^6.2.0" }
fastapi = { version="^0.115" }
boto3 = { version="1.40.14" }
pandas = { version="^2.2.2" }
numba = {version="^0.60.0"}
paramiko = { version = "3.5.1" }
starlette_context = { version = "0.4.0" }
openpyxl = { version = "^3.0.10" }
pydantic = { version = "^2.0.0" }

[tool.poetry.group.dev.dependencies]
openbb-devtools = { version = "^1.0.0" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_core_extension"]
oport = "oport.router:router"

[tool.poetry.plugins."openbb_provider_extension"]
oport = "oport.provider:provider"
